name: Build native EdgeNotes for Windows
on:
  workflow_dispatch:
  push:
    paths: ['native/windows/**', '.github/workflows/windows-native.yml', 'release/**']
    tags:
      - 'v*'
  pull_request:
    paths: ['native/windows/**', '.github/workflows/windows-native.yml']
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x64, x86]
    steps:
      - uses: actions/checkout@v4
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}
      - name: Compile native app and run storage tests
        shell: pwsh
        run: ./native/windows/build.ps1
      - name: Package portable Windows app
        shell: pwsh
        run: |
          Copy-Item native/windows/README.md native/windows/build/README.md
          Copy-Item native/windows/build/EdgeNotes.exe native/windows/build/EdgeNotes-windows-${{ matrix.arch }}.exe
          Compress-Archive -Path native/windows/build/EdgeNotes.exe,native/windows/build/excalifont-regular.ttf,native/windows/build/README.md -DestinationPath native/windows/build/EdgeNotes-windows-${{ matrix.arch }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: EdgeNotes-windows-${{ matrix.arch }}
          path: native/windows/build/EdgeNotes-windows-${{ matrix.arch }}.zip
          if-no-files-found: error
          retention-days: 30
      - name: Create or update GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native/windows/build/EdgeNotes-windows-${{ matrix.arch }}.zip
            native/windows/build/EdgeNotes-windows-${{ matrix.arch }}.exe
            native/windows/build/excalifont-regular.ttf
          generate_release_notes: true